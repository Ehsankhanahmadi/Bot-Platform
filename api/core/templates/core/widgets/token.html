{% if widget.attrs.runtime_id %}
<div style="display: flex; gap: 8px; align-items: center; width: 100%;">
    {% include "django/forms/widgets/text.html" %}
    <button type="button" class="button" style="padding: 4px;" id="generate-token-btn">
        Generate Token
    </button>
    <button type="button" class="button" style="padding: 4px;" id="copy-token-btn">
        Copy
    </button>
    <button type="button" class="button" style="padding: 4px;" id="hash-token-btn">
        Hash
    </button>
</div>
<script>
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== "") {
            const cookies = document.cookie.split(";");
            for (let cookie of cookies) {
                cookie = cookie.trim();
                if (cookie.startsWith(name + "=")) {
                    cookieValue = decodeURIComponent(
                        cookie.substring(name.length + 1)
                    );
                    break;
                }
            }
        }
        return cookieValue;
    }
    document.addEventListener("DOMContentLoaded", function () {
        const tokenInput = document.getElementById("id_token");
        const generateButton = document.getElementById("generate-token-btn");
        const copyButton = document.getElementById("copy-token-btn");
        const hashButton = document.getElementById("hash-token-btn");
        if (generateButton) {
            generateButton.addEventListener("click", function () {
                const randomBytes = new Uint8Array(32);
                crypto.getRandomValues(randomBytes);
                const token = btoa(
                    String.fromCharCode(...randomBytes)
                )
                .replace(/\+/g, "-")
                .replace(/\//g, "_")
                .replace(/=/g, "");
                tokenInput.value = token;
            });
        }
        if (copyButton) {
            copyButton.addEventListener("click", async function () {
                if (!tokenInput.value) {
                    alert("There is no token to copy");
                    return;
                }
                await navigator.clipboard.writeText(tokenInput.value);
                alert("Token successfully copied")
            });
        }
        if (hashButton) {
            hashButton.addEventListener("click", async function () {
                if (!tokenInput.value) {
                    alert("There is no token to hash.");
                    return;
                }
                const csrfToken = getCookie("csrftoken");
                const response = await fetch(
                    "{% url 'admin:runtime-hash-token' widget.attrs.runtime_id %}",
                    {
                        method: "POST",
                        headers: {
                            "X-CSRFToken": csrfToken,
                            "Content-Type": "application/x-www-form-urlencoded",
                        },
                        body: new URLSearchParams({
                            token: tokenInput.value,
                        }),
                    }
                );
                const data = await response.json();
                if (response.ok) {
                    alert(data.detail);
                    window.location.reload();
                } else {
                    alert(data.error || "Something went wrong.");
                }
            });
        }
    });
</script>
{% endif %}
