{% if widget.attrs.runtime_id %}
<div style="display: flex; gap: 8px; align-items: center; order: 1; width: auto;">
    {% include "django/forms/widgets/checkbox.html" %}
    <button type="button" class="button" style="padding: 4px;" id="clear-cache-btn">
        clear cache
    </button>
</div>
<script>
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== "") {
            const cookies = document.cookie.split(";");
            for (let cookie of cookies) {
                cookie = cookie.trim();
                if (cookie.startsWith(name + "=")) {
                    cookieValue = decodeURIComponent(
                        cookie.substring(name.length + 1)
                    );
                    break;
                }
            }
        }
        return cookieValue;
    }
    document.addEventListener("DOMContentLoaded", function () {
        const statuscheck = document.getElementById("id_status");
        const clearButton = document.getElementById("clear-cache-btn");
        if (clearButton) {
            clearButton.addEventListener("click", async function () {
                const csrfToken = getCookie("csrftoken");
                const response = await fetch(
                    "{% url 'admin:runtime-clear-cache' widget.attrs.runtime_id %}",
                    {
                        method: "POST",
                        headers: {
                            "X-CSRFToken": csrfToken,
                            "Content-Type": "application/x-www-form-urlencoded",
                        },
                        body: new URLSearchParams({
                            status: statuscheck.checked ? "true" : "false",
                        }),
                    }
                );
                const data = await response.json();
                if (response.ok) {
                    alert(data.detail);
                    window.location.reload();
                } else {
                    alert(data.error || "Something went wrong.");
                }
            });
        }
    });
</script>
{% endif %}
